site_name: klua
site_description: Fast, self-healing package manager built with C++20 and Lua
site_url: https://readthedocs.io
repo_url: https://github.com
repo_name: kiru0414/klua

theme:
  name: material
  logo: asset/logo.svg
  favicon: asset/logo.svg  
  palette:
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.sections
    - search.highlight

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - klua.yaml Manifest: klua-yaml.md
  - Lua API Reference: lua-api.md
  - Taps & Registry: taps-and-registry.md
