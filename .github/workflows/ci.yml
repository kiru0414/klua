name: CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "builtin/**"
      - "tests/**"
      - "CMakeLists.txt"
      - ".github/workflows/ci.yml"
  pull_request:

jobs:
  test:
    name: Build & test (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev unzip

      - name: Configure
        run: cmake -S . -B build -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j 4

      - name: Milestone 1 tests (offline)
        run: bash tests/test_milestone1.sh

      - name: Milestone 2 tests (network)
        run: bash tests/test_milestone2.sh

      - name: Milestone 3 tests (manifests, sync, upgrade)
        run: bash tests/test_milestone3.sh

      - name: UX tests (remove, typo suggestions)
        run: bash tests/test_ux.sh

      - name: v0.4.0 tests (conflict safety, run, management, repair backup)
        run: bash tests/test_v04.sh

      - name: v0.5.0 tests (API-free GitHub, shard cache, SHA-256)
        run: bash tests/test_v05.sh

      - name: v0.6.0 tests (system delegation, tokens, lockfiles)
        run: bash tests/test_v06.sh

      - name: v0.7.0 tests (parallel batches, Atom fallback, TOFU, verify)
        run: bash tests/test_v07.sh

      - name: v0.8.0 tests (confirmation, pruning, outdated, dry-run)
        run: bash tests/test_v08.sh

      - name: HTTP redirect regression tests (cross-host header hygiene)
        run: bash tests/test_http_redirects.sh

      - name: System sudo regression tests (non-root Linux elevation)
        run: bash tests/test_system_sudo.sh

      - name: v0.9.0 tests (version selection, pinning, use, remove)
        run: bash tests/test_v09.sh

      - name: v0.9.1 tests (system tracking, API-free discovery, link safety)
        run: bash tests/test_v091.sh

  build-macos:
    name: Build (macOS arm64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_BUILD_TYPE=Release
          -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"

      - name: Build
        run: cmake --build build -j 4

      - name: Smoke test
        run: |
          ./build/klua --version
          ./build/klua repair
          ./build/klua list
